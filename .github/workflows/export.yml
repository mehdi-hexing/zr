name: 📦 Export Worker Files

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Encode panel
        run: base64 -w0 index.html > src/panel.b64

      - name: Build bundle (wrangler dry-run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist

      - name: Normalise modules
        run: |
          ls -la dist
          python3 - <<'PY'
          import glob, os, re, shutil, sys

          js = open("dist/index.js", encoding="utf-8").read()

          def inline_b64(m):
              path = os.path.join("dist", m.group(2)[2:])
              data = "".join(open(path, encoding="utf-8").read().split())
              return f'const {m.group(1)} = "{data}";'

          js, n_b64 = re.subn(r'import\s+(\w+)\s+from\s+"(\./[^"]+\.b64)";', inline_b64, js)

          target = os.path.join("dist", "zr-bg.wasm")
          files = [f for f in glob.glob("dist/*.wasm") if f != target]
          if len(files) == 1:
              shutil.copy(files[0], target)
          elif not (len(files) == 0 and os.path.exists(target)):
              sys.exit(f"expected exactly 1 .wasm in dist, found {len(files)}")
          js, n_wasm = re.subn(r'from\s+"\./[^"]+\.wasm"', 'from "./zr-bg.wasm"', js)

          if n_b64 < 1 or n_wasm < 1:
              sys.exit(f"rewrite failed (b64: {n_b64}, wasm: {n_wasm})")
          if re.search(r'from\s+"\./[^"]*\.b64"', js):
              sys.exit("a .b64 import is still left in the bundle")

          open("dist/index.final.js", "w", encoding="utf-8").write(js)
          print(f"inlined {n_b64} b64 module(s), normalised {n_wasm} wasm import(s)")
          PY

      - name: Collect worker.js and _worker.js
        run: |
          mkdir -p out/worker out/_worker
          cp dist/index.final.js out/worker/worker.js
          cp dist/index.final.js out/_worker/_worker.js
          cp dist/zr-bg.wasm out/worker/
          cp dist/zr-bg.wasm out/_worker/
          echo "--- worker.js bundle:"; ls -la out/worker
          echo "--- _worker.js bundle:"; ls -la out/_worker

      - name: Upload worker.js
        uses: actions/upload-artifact@v4
        with:
          name: worker.js
          path: out/worker/
          if-no-files-found: error

      - name: Upload _worker.js
        uses: actions/upload-artifact@v4
        with:
          name: _worker.js
          path: out/_worker/
          if-no-files-found: error
