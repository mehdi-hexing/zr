name: 📦 Export Worker Files

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Encode panel
        run: base64 -w0 index.html > src/panel.b64

      - name: Build bundle (wrangler dry-run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist

      - name: Collect worker.js and _worker.js
        run: |
          ls -la dist
          mkdir -p out/worker out/_worker
          cp dist/index.js out/worker/worker.js
          cp dist/index.js out/_worker/_worker.js
          # index.js imports the compiled .wasm and the panel .b64 by relative path,
          # so every extra module Wrangler emitted must stay next to the js
          for f in dist/*; do
            case "$(basename "$f")" in
              index.js|README.md|*.map) ;;
              *) cp "$f" out/worker/; cp "$f" out/_worker/ ;;
            esac
          done
          echo "--- worker.js bundle:"; ls -la out/worker
          echo "--- _worker.js bundle:"; ls -la out/_worker

      - name: Upload worker.js
        uses: actions/upload-artifact@v4
        with:
          name: worker.js
          path: out/worker/
          if-no-files-found: error

      - name: Upload _worker.js
        uses: actions/upload-artifact@v4
        with:
          name: _worker.js
          path: out/_worker/
          if-no-files-found: error
